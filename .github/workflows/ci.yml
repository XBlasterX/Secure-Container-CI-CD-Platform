name: CI
env:
  PYTHON_VERSION: "3.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  app_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python

        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install ".[dev]"

      - name: run ruff
        run: |
          python -m ruff check src tests
      - name: Pytest
        run: |
          python -m pytest -q

  build_scan:
    needs: app_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          file: Dockerfile
          tags: image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: SBOM generate
        run: |
          trivy image --format cyclonedx --output sbom.json image:latest

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Generate SBOM in SPDX format
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "0.36.0"
          image-ref: image:latest
          scan-type: image
          format: "spdx-json"
          output: "sbom.spdx"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: RUN TRIVY VULNERABILITY SCAN

        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "0.36.0"
          image-ref: image:latest
          scan-type: image
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Save Docker image
        run: docker save -o image.tar image:latest

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  publish:
    needs: build_scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar
      - name: Tag Docker image
        run: docker tag image:latest ${{ steps.meta.outputs.tags }}
      - name: Push Docker image
        run: docker push ${{ steps.meta.outputs.tags }}
