name: CI
env:
  PYTHON_VERSION: "3.12"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install ".[dev]"
      - name: Install Lintters
        run: |
          python -m ruff check src tests
      - name: Pytest
        run: |
          python -m pytest -q
