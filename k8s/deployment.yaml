---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-platform-deployment
  namespace: secure-platform
  labels:
    app: secure-platform

spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-platform
  template:
    metadata:
      labels:
        app: secure-platform
    spec:
      containers:
        - name: secure-platform-container
          image: secure-api:k8s-v1
          ports:
            - containerPort: 8000
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
