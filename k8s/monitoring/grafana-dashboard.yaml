  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: PBFA97CFB590B2093
        isDefault: true
        type: prometheus
        access: proxy
        url: http://prometheus-service.secure-platform.svc.cluster.local:9090
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "infrastructure"

        type: file

        disableDeletion: false

        updateIntervalSeconds: 10

        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/

          foldersFromFilesStructure: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: secure-platform
  labels:
    app: app-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-grafana
  template:
    metadata:
      labels:
        app: app-grafana
    spec:
      containers:
        - name: grafana-container
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-dashboard-volume
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-dashboard-volume
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.json
              subPath: dashboard.json
            - name: grafana-dashboard-volume
              mountPath: /etc/grafana/provisioning/dashboards/infrastructure-events.json
              subPath: infrastructure-events.json
            - name: grafana-dashboard-volume
              mountPath: /etc/grafana/provisioning/dashboards/demonstration.json
              subPath: demonstration.json
            - name: grafana-dashboard-volume
              mountPath: /etc/grafana/provisioning/datasources/prometheus-datasource.yaml
              subPath: prometheus-datasource.yaml
      volumes:
        - name: grafana-dashboard-volume
          configMap:
            name: grafana-dashboard-config
            items:
              - key: dashboard.json
                path: dashboard.json
              - key: prometheus-datasource.yaml
                path: prometheus-datasource.yaml
              - key: dashboards.yaml
                path: dashboards.yaml
              - key: infrastructure-events.json
                path: infrastructure-events.json
              - key: demonstration.json
                path: demonstration.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: secure-platform
  labels:
    app: app-grafana
spec:
  type: ClusterIP
  selector:
    app: app-grafana
  ports:
    - protocol: TCP
      port: 3000
