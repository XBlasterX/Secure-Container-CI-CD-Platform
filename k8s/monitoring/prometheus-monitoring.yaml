apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-platform-config
  namespace: secure-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: infrastructure-api
        static_configs:
          - targets:
            - secure-platform-service:8000
  alerts.yml: |
    groups:
    - name: infrastructure-api
      rules:
        - alert: APIMetricsUnavailable
          expr: up{job="infrastructure-api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus cannot scrape infrastructure API"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: secure-platform
  labels:
    app: app-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-prometheus
  template:
    metadata:
      labels:
        app: app-prometheus
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus-container
          image: prom/prometheus:v2.44.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: secure-platform-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
              - key: alerts.yml
                path: alerts.yml
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: secure-platform
  labels:
    app: app-prometheus
spec:
  type: ClusterIP
  selector:
    app: app-prometheus
  ports:
    - protocol: TCP
      port: 9090
