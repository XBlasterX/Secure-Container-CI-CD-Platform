rules:
  no-workflow-keywords-in-env:
    description: "BŁĄD LOGICZNY: Klucz '{{property}}' nie może być wewnątrz 'env:'. Przenieś go do 'steps:'."
    message: "{{description}}"
    severity: error
    given: "$..env"
    then:
      - field: "uses"
        function: falsy
      - field: "run"
        function: falsy
      - field: "steps"
        function: falsy
      - field: "with"
        function: falsy

  env-values-must-be-strings:
    description: "PUŁAPKA YAML: Wartość '{{property}}' w 'env' to liczba zamiast tekstu. Daj ją w cudzysłów (np. '3.13')."
    message: "{{description}}"
    severity: warn
    given: "$..env.*"
    then:
      function: schema
      functionOptions:
        schema:
          type: string

  require-job-timeout:
    description: "DOBRA PRAKTYKA: Job '{{property}}' nie ma ustawionego 'timeout-minutes'."
    message: "{{description}}"
    severity: warn
    given: "$.jobs.*"
    then:
      field: "timeout-minutes"
      function: truthy
